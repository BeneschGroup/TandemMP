[package]
name = "spline_psf"
version = "0.1.0"
edition = "2021"
# 1.88 stabilised slice::as_chunks (used by spline_psf); both crates build in one install.
rust-version = "1.88"
description = "Bundled experimental spline PSF for TandemMP with PyO3 bindings."

[lib]
name = "spline_psf"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
numpy = "0.29"

# Keep panic unwinding enabled so PyO3 can convert panics to Python exceptions.
[profile.release]
lto = "fat"
codegen-units = 1

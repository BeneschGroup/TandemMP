[package]
name = "drift_correction"
version = "0.1.0"
edition = "2021"
description = "Drift correction for TandemMP with PyO3 bindings."

# rlib only: linked into the tandemmp._rust._native cdylib (see ../_native)
# and compiled directly for `cargo test`.
[lib]
name = "drift_correction"
crate-type = ["rlib"]

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
# Use Python's stable ABI, with Python 3.10 as the minimum version.
pyo3 = { version = "0.29", features = ["abi3-py310"] }
numpy = "0.29"

[dev-dependencies]

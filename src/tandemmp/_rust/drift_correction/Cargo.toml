[package]
name = "drift_correction"
version = "0.1.0"
edition = "2021"
# 1.88 stabilised slice::as_chunks (used by spline_psf); both crates build in one install.
rust-version = "1.88"
description = "Drift correction for TandemMP with PyO3 bindings."

# Build a Python extension and a library for Rust tests and documentation.
[lib]
name = "drift_correction"
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
# Use Python's stable ABI, with Python 3.10 as the minimum version.
pyo3 = { version = "0.29", features = ["abi3-py310"] }
numpy = "0.29"

[dev-dependencies]

# Optimise the numerical loop with cross-crate inlining. Keep panic unwinding
# enabled so PyO3 can convert panics to Python exceptions.
[profile.release]
lto = "fat"
codegen-units = 1

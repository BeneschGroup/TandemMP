# Independent maturin project for this one Rust crate. Deliberately NOT
# folded into the repo-root `pyproject.toml` (that project stays on
# setuptools, per WORKLIST.md's Rust-acceleration convention: "each should
# be implemented as a PyO3 crate under src/tandemmp/_rust/", built and
# versioned separately from the pure-Python package).
#
# `module-name` + `python-source` together tell maturin to build this
# crate's cdylib as `tandemmp/_rust/drift_correction.<ext>` directly inside
# the *existing* `src/` tree (three levels up from this file), so it lands
# exactly where the repo-root project's editable install
# (`pip install -e ".[dev]"`, `package-dir = {"" = "src"}`) already expects
# to find `tandemmp._rust.drift_correction` — no separate site-packages
# copy, no conflict with the `tandemmp` distribution's own metadata (this
# project's `[project.name]` below is a distinct distribution,
# `tandemmp-drift-correction`).
#
# Build/dev workflow (see this crate's `lib.rs` module docs for the Rust
# side):
#   maturin develop          # editable build into src/tandemmp/_rust/
#   maturin develop --release  # same, optimised (recommended for real use —
#                                 differential evolution is CPU-bound)
#   maturin build --release  # produce a standalone wheel (e.g. for CI)
#
# `cargo build` / `cargo test` run directly (bypassing maturin) also work
# unmodified — see Cargo.toml's `[lib] crate-type` comment.

[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "tandemmp-drift-correction"
version = "0.1.0"
description = "Native shift + RMSE drift-correction hot path for tandemmp (tandemmp._rust.drift_correction), built with PyO3/maturin."
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
module-name = "tandemmp._rust.drift_correction"
# Three levels up from this crate directory (drift_correction -> _rust ->
# tandemmp -> src) is the root the main project's `package-dir = {"" =
# "src"}` / editable install already uses.
python-source = "../../.."
features = ["pyo3/extension-module"]

[package]
name = "psf"
version = "0.1.0"
edition = "2021"
description = "Experimental spline PSF (RectBivariateSpline-parity) for TandemMP, with PyO3 bindings."

# rlib only: linked into the tandemmp._rust._native cdylib (see ../_native)
# and compiled directly for `cargo test`.
[lib]
name = "psf"
crate-type = ["rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
numpy = "0.29"
rayon = "1.10"

[dev-dependencies]

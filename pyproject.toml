[build-system]
# setuptools-rust compiles the two PyO3 crates under src/tandemmp/_rust/ as part
# of the normal build, so one wheel per platform carries the pure-Python package
# *and* both native extensions. Building from source needs a Rust toolchain.
requires = ["setuptools>=68", "wheel>=0.41", "setuptools-rust>=1.10"]
build-backend = "setuptools.build_meta"

[project]
name = "tandemmp"
version = "0.8.0-dev"
description = "Tracking/monitoring particles on the coverslip during a Mass Photometry experiment"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "scikit-learn",
    "tqdm",
    "opencv-python",
    # Keras 2 for the ghost model; needs TF_USE_LEGACY_KERAS=1 set before
    # tensorflow is imported. tf-keras must match the tensorflow minor version.
    "tensorflow>=2.21,<2.22",
    "tf-keras>=2.21,<2.22",
    "h5py",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
tandemmp = ["resources/*.h5"]
# Type stubs only: the compiled extensions are added by setuptools-rust below
# and are no longer committed to git.
"tandemmp._rust" = ["*.pyi"]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Native extensions (Rust / PyO3), built by setuptools-rust
# ---------------------------------------------------------------------------
# Both crates use PyO3's stable ABI (abi3-py310), so a single wheel per
# OS/architecture works for every Python >= 3.10.

[[tool.setuptools-rust.ext-modules]]
target = "tandemmp._rust.drift_correction"
path = "src/tandemmp/_rust/drift_correction/Cargo.toml"
binding = "PyO3"
py-limited-api = true
# Always optimise: the numerical hot paths are unusably slow as debug builds.
debug = false

[[tool.setuptools-rust.ext-modules]]
target = "tandemmp._rust.spline_psf"
path = "src/tandemmp/_rust/spline_psf/Cargo.toml"
binding = "PyO3"
py-limited-api = true
# Always optimise: the numerical hot paths are unusably slow as debug builds.
debug = false

[tool.distutils.bdist_wheel]
# Tag wheels cp310-abi3-<platform> instead of one wheel per Python version.
py-limited-api = "cp310"

# ---------------------------------------------------------------------------
# cibuildwheel (used by .github/workflows/wheels.yml)
# ---------------------------------------------------------------------------

[tool.cibuildwheel]
# abi3: build once against the oldest supported Python.
build = "cp310-*"
# TensorFlow publishes no musllinux wheels, so skip them.
skip = "*-musllinux_*"
# Don't pull TensorFlow & co. into the throwaway test env: the smoke test only
# needs the two extension modules to import and the tandemmp package to load.
test-requires = "numpy"
test-environment = { PIP_NO_DEPS = "1" }
test-command = "python -c \"import tandemmp._rust.drift_correction, tandemmp._rust.spline_psf\""

[tool.cibuildwheel.linux]
# manylinux images ship no Rust; install it for the build.
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --import-mode=importlib"
pythonpath = ["src"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["notebooks/", "alex_area/", "deprecated/"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "ANN",  # flake8-annotations
]
ignore = [
    "ANN101",  # Missing type annotation for `self`
    "ANN102",  # Missing type annotation for `cls`
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E501", "N806"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# Exclude Cargo build output from Python source discovery.
exclude = ["notebooks/", "tests/", "alex_area/", "deprecated/", "_rust/.*/target/"]

[[tool.mypy.overrides]]
# Old pre-refactor Rust extension — not typed; suppress errors from transitive imports.
module = ["deprecated.rust", "deprecated.rust.*"]
ignore_errors = true

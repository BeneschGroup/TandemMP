[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "tandemmp"
version = "0.8.0-dev"
description = "Tracking/monitoring particles on the coverslip during a Mass Photometry experiment"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "scikit-learn",
    "tqdm",
    "opencv-python",
    "tensorflow",
    "h5py",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.10"]

[tool.maturin]
python-source = "src"
module-name = "tandemmp._rust._native"
manifest-path = "src/tandemmp/_rust/_native/Cargo.toml"
features = ["pyo3/extension-module"]
# Keep Rust sources, tests, and build output out of the wheel.
exclude = [
    "tandemmp/_rust/drift_correction/**",
    "tandemmp/_rust/psf/**",
    "tandemmp/_rust/_native/**",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --import-mode=importlib"
pythonpath = ["src"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["notebooks/", "alex_area/", "deprecated/"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "ANN",  # flake8-annotations
]
ignore = [
    "ANN101",  # Missing type annotation for `self`
    "ANN102",  # Missing type annotation for `cls`
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E501", "N806"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# Exclude Cargo build output from Python source discovery.
exclude = ["notebooks/", "tests/", "alex_area/", "deprecated/", "_rust/.*/target/"]

name: Wheels

# Builds one wheel per OS/architecture (Windows, Linux, macOS Intel + Apple
# Silicon). The Rust extensions use PyO3's stable ABI, so each wheel works for
# every Python >= 3.10. Tag a release with `vX.Y.Z` to also attach the wheels
# to a GitHub Release.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/tandemmp/_rust/**"
      - "scripts/check_wheel_paths.py"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # Linux x86_64 (manylinux)
          - ubuntu-24.04-arm   # Linux aarch64 (manylinux)
          - windows-latest     # Windows x86_64
          - macos-15-intel     # macOS x86_64
          - macos-latest       # macOS arm64 (Apple Silicon)

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        with:
          output-dir: wheelhouse

      - name: Check wheels for personal paths
        run: python scripts/check_wheel_paths.py wheelhouse/*.whl
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist --outdir dist

      - name: Check sdist for personal paths
        run: python scripts/check_wheel_paths.py dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    # Only for pushed `v*` tags, and only when pushed by an allowlisted maintainer.
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      contains(fromJSON('["alexross-o","joshualiambishop"]'), github.actor)
    needs: [build_wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

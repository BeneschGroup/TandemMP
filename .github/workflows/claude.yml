name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Gate: only the allowlisted maintainers (alexross-o, joshualiambishop), and only
    # for content they authored, so an outsider's text (e.g. an issue they assign)
    # can't drive a run. Matched by login, not author_association, which reads
    # CONTRIBUTOR for org members with private membership. To add a maintainer,
    # append their login to every list below.
    if: |
      contains(fromJSON('["alexross-o","joshualiambishop"]'), github.event.sender.login) &&
      (
        (github.event_name == 'issue_comment'
          && contains(fromJSON('["alexross-o","joshualiambishop"]'), github.event.comment.user.login)
          && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment'
          && contains(fromJSON('["alexross-o","joshualiambishop"]'), github.event.comment.user.login)
          && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review'
          && contains(fromJSON('["alexross-o","joshualiambishop"]'), github.event.review.user.login)
          && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues'
          && contains(fromJSON('["alexross-o","joshualiambishop"]'), github.event.issue.user.login)
          && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          claude_args: '--model claude-sonnet-5-5'

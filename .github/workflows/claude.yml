name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Gate: only run for the allowlisted maintainers (alexross-o, joshualiambishop),
    # AND only when the content that triggered the run was authored by one of them.
    # The first check restricts *who* can trigger it; the second stops a run being
    # driven by text an outsider wrote (e.g. a maintainer assigning an outsider's
    # issue that contains '@claude').
    # We match on login, not author_association: association is reported as
    # CONTRIBUTOR for org members whose membership is private, which would lock out
    # the very people this is meant to allow. To add a maintainer, append their
    # login to every list below.
    if: |
      contains(fromJSON('["alexross-o","joshualiambishop"]'), github.event.sender.login) &&
      (
        (github.event_name == 'issue_comment'
          && contains(fromJSON('["alexross-o","joshualiambishop"]'), github.event.comment.user.login)
          && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment'
          && contains(fromJSON('["alexross-o","joshualiambishop"]'), github.event.comment.user.login)
          && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review'
          && contains(fromJSON('["alexross-o","joshualiambishop"]'), github.event.review.user.login)
          && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues'
          && contains(fromJSON('["alexross-o","joshualiambishop"]'), github.event.issue.user.login)
          && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          claude_args: '--model claude-sonnet-5-5'

name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
    paths:
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Write,Bash(gh api:*),Bash(cat:*),Bash(ls:*),Bash(grep:*),Bash(rg:*),Bash(find:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(sed:*),Bash(awk:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a comprehensive code review with the following focus areas:

            1. **Code Quality**
               - Clean code principles and best practices
               - Proper error handling and edge cases
               - Code readability and maintainability

            2. **Security**
               - Check for potential security vulnerabilities
               - Validate input sanitization
               - Review authentication/authorization logic

            3. **Performance**
               - Identify potential performance bottlenecks
               - Review database queries for efficiency
               - Check for memory leaks or resource issues

            4. **Testing**
               - Verify adequate test coverage
               - Review test quality and edge cases
               - Check for missing test scenarios

            5. **Type Safety**
               - Ensure type annotations are correct and complete
               - Check for Any or missing annotations in public APIs

            6. **Documentation**
               - Ensure code is properly documented
               - Verify README updates for new features
               - Check API documentation accuracy

            Structure your review with:
            - Specific issues called out with file paths and line numbers, each numbered sequentially (1, 2, …)
            - General observations and overall assessment
            - A concise checklist of changes that should be made, referencing issue numbers where applicable

            When referencing specific issues, use the actual file line numbers
            from the source files, not line numbers from the diff output.
            After reading the diff with gh pr diff, open the relevant files
            directly with the Read tool to verify line numbers before
            referencing them.

            ## Posting the review (required final step)

            After completing your analysis, you MUST post the review as a PR comment.
            Do not end your turn until this is done.

            1. Write the full review to ${{ github.workspace }}/review.md
            2. Post it with:
              gh pr comment ${{ github.event.pull_request.number }} \
                --repo ${{ github.repository }} \
                --body-file ${{ github.workspace }}/review.md
            3. Confirm the command succeeded (non-zero exit = retry once)

            Use --body-file rather than --body to avoid shell-escaping issues
            with backticks, code fences, and pipes in the review content.
                    
          show_full_output: true

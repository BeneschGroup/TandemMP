name: CI

on:
  push:
    branches: [main, refactor]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'

jobs:
  rust:
    name: Rust CI (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [drift_correction, spline_psf]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/tandemmp/_rust/${{ matrix.crate }}

      - name: cargo fmt --check
        working-directory: src/tandemmp/_rust/${{ matrix.crate }}
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src/tandemmp/_rust/${{ matrix.crate }}
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src/tandemmp/_rust/${{ matrix.crate }}
        run: cargo test --release

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project + test dependencies
        run: pip install ".[dev]"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src/tandemmp/_rust/drift_correction
            src/tandemmp/_rust/spline_psf
          # Keep build caches separate for each Python version.
          key: ${{ matrix.python-version }}

      - name: Build & install Rust extensions (maturin)
        working-directory: src/tandemmp/_rust
        run: |
          pip install maturin
          for crate in drift_correction spline_psf; do
            # Build a wheel because setup-python does not create a virtualenv.
            (cd "$crate" && maturin build --release --out dist && pip install dist/*.whl)
            # Pytest imports from src/, so copy the extension into that package.
            python -c "
          import glob, sys, zipfile, shutil
          crate = sys.argv[1]
          wheel = glob.glob(f'{crate}/dist/*.whl')[0]
          with zipfile.ZipFile(wheel) as zf:
              for name in zf.namelist():
                  if name.startswith(f'tandemmp/_rust/{crate}.') and not name.endswith('/'):
                      dest = name.rsplit('/', 1)[-1]
                      with zf.open(name) as src, open(dest, 'wb') as out:
                          shutil.copyfileobj(src, out)
                      print(f'Copied {name} -> src/tandemmp/_rust/{dest}')
          " "$crate"
          done

      - name: Run tests
        run: pytest

  lint:
    name: Linting (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ".[dev]"

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  type-check:
    name: Type checking (mypy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install project + dev dependencies
        run: pip install ".[dev]"

      - name: Run mypy
        run: mypy src/

  security:
    name: Security scan (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: pip install "." pip-audit

      - name: Run pip-audit
        # CVE-2026-3219 affects pip itself; no fix version published yet.
        run: pip-audit --ignore-vuln CVE-2026-3219

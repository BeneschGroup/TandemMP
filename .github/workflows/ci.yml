name: CI

on:
  push:
    branches: [main, refactor]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'

jobs:
  rust:
    name: Rust CI (drift_correction)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/tandemmp/_rust/drift_correction

      - name: cargo fmt --check
        working-directory: src/tandemmp/_rust/drift_correction
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src/tandemmp/_rust/drift_correction
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src/tandemmp/_rust/drift_correction
        run: cargo test --release

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project + test dependencies
        run: pip install ".[dev]"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/tandemmp/_rust/drift_correction
          # abi3 wheels aren't Python-version-specific, but each matrix job
          # builds independently (maturin develop installs into that job's
          # venv) — separate cache keys avoid cross-job artifact reuse
          # across different CPython headers.
          key: ${{ matrix.python-version }}

      - name: Build & install tandemmp._rust.drift_correction (maturin)
        working-directory: src/tandemmp/_rust/drift_correction
        run: |
          pip install maturin
          # `maturin develop` requires VIRTUAL_ENV/CONDA_PREFIX to locate the
          # target environment, which actions/setup-python doesn't set (it
          # just puts a system Python on PATH, no venv). `maturin build` +
          # `pip install` of the resulting wheel needs neither.
          maturin build --release --out dist
          pip install dist/*.whl

      - name: Run tests
        run: pytest

  lint:
    name: Linting (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ".[dev]"

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  type-check:
    name: Type checking (mypy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install project + dev dependencies
        run: pip install ".[dev]"

      - name: Run mypy
        run: mypy src/

  security:
    name: Security scan (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: pip install "." pip-audit

      - name: Run pip-audit
        # CVE-2026-3219 affects pip itself; no fix version published yet.
        run: pip-audit --ignore-vuln CVE-2026-3219
